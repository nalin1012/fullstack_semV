<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Responsive Grid</title><style>
        .container{
            display: grid;
            grid-template-columns: 180px minmax(0, 1fr) minmax(0, 1fr);
            grid-template-areas:
                "header header header"
                "sidebar main main"
                "sidebar main main"
                "sidebar card1 card2"
                "footer footer footer";
            grid-auto-rows: minmax(110px, auto);
            min-height: 90vh;
            gap: 10px;
            padding: 10px;
            box-sizing: border-box;

        }
        .box{
            outline: 3px solid black;
            background-color: blanchedalmond;
            padding: 20px;
            box-sizing: border-box;
        }

        @media (max-width: 600px){
            .container{
                grid-template-columns: 1fr;
                grid-template-areas:
                    "header"
                    "main"
                    "sidebar"
                    "card1"
                    "card2"
                    "footer";
            }
        }
        
    </style>
</head>
<body>
    <div class="container">
        <div class="box" style="grid-area: header;">header</div>
        <div class="box" style="grid-area: main;">1</div>
        <div class="box" style="grid-area: sidebar;">2</div>
        <div class="box" style="grid-area: card1;">3</div>
        <div class="box" style="grid-area: card2;">4</div>
        <div class="box" style="grid-area: footer;">5</div>
    </div>
</body>
</html>
