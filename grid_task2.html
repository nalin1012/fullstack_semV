<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title><style>
        .container{
        display:grid;
        height: 90vh;
        grid-template-columns: repeat(3,1fr); 
      grid-template-areas:
        "header header header"
        "sidebar main main"
        "sidebar main main"
        "sidebar card1 card2"
        "footer footer footer"
        ;
        gap:5px;

        }
        .box{
            outline: 3px solid black;
            background-color: blanchedalmond;
        }
        
    </style>
</head>
<body>
    <div class="container">
        <div class="box" style="grid-area: header;">header</div>
        <div class="box" style="grid-area: main;">1</div>
        <div class="box" style="grid-area: sidebar;">2</div>
        <div class="box" style="grid-area: card1;">3</div>
        <div class="box" style="grid-area: card2;">4</div>
        <div class="box" style="grid-area: footer;">5</div>
    </div>
</body>
</html>
