<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        :root{
            --primary-color: black;
            --secondary-color: yellow;
            --textsize:30px;
            --secondary-textsize: 20px;
        }
        .container{
            display: grid;
            outline: 1px solid black;
            grid-template-columns: 1fr 1fr 1fr;
            grid-template-rows: 1fr 1fr 1fr;
            height: 500px;
            width: 500px;

        }
        .parent{
            display: grid;
            grid-template-columns: subgrid;
            grid-template-rows: subgrid;
            font-size: calc(var(--textsize) + var(--secondary-textsize));
            grid-column: 1/3;
            grid-row: 1/3;
            background-color: var(--secondary-color);

        }
        .child{
            /* background-color:red; */
            grid-column:1/2;
            grid-row:1/2;
            background-color: var(--secondary-color);
        }
        
        /* .container>div{

            background-color: blanchedalmond;
            
        }
        #box6{
            grid-column: 2/3;
            grid-row: 1/2; */
            
        
          
    </style>
</head>
<body>
    <div class="container">
        <div class="parent">
            <div class="child">1</div>
        </div>
    </div>
