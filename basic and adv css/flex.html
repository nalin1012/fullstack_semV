<head>

            flex-wrap: wrap;

        }

        }
        #three{
            flex: 1;
            height: 100px;
            background-color: rgb(15, 230, 76);
            min-width: 100px;
        }

        
    </style>
</head>
<body>
    <div class="container">
        <div id="one">1</div>
        <div id="two">2</div>
        <div id="three">3</div>
    </div>
    
</body>
</html>
