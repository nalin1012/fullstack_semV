<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container{
            flex-direction: row;
            outline: 3px solid red;
            height: 90vh;
            display: flex;
            

        }
        .container>div{
            color: white;
            height: 100px;
        }
        #box1{
            background-color: red;
            flex-basis: 150px;
            flex-grow: 2;
        }
        #box2{
            background-color: blue;
            flex-grow: 1;
        }
        #box3{
            background-color: green;
            flex-grow: 3;
        }
    </style>
</head>
<body>
    <div class="container">
        <div id="box1">Box 1</div>
        <div id="box2">Box 2</div>
        <div id="box3">Box 3</div>
    </div>
</body>
</html>
