<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid</title>
    <style>
        /*  minmax ,fraction,repeat */
        .container{
            display:grid;
            /* grid-template-columns: 300px 300px ;
            grid-template-rows: 300px 300px; */


            /* grid-template-columns: 1fr 1fr ;
            grid-template-rows: 1fr 1fr; */


            /* height: 90vh;
            grid-template-columns: repeat(3,1fr); */


            /* height: 90vh;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            grid-template-rows: auto; */



            

           grid-template-columns: repeat(auto-fill, minmax(100px, fr));
      grid-template-areas:
        "box1 box1 box2"
        "box1 box1 box3"
        "box4 box4 box5"
        "box6 box6 box7"
        "box8 box9 box7";


            gap: 15px; 
        }
        .container>div{
            
            height:300px;
            outline: 3px solid black;
        }
    </style>
</head>
<body>
    <div class="container">
        <div id="box1">1</div>
        <div id="box2">2</div>
        <div id="box3">3</div>
        <div id="box4">4</div>
        <div id="box5">5</div>
        <div id="box6">6</div>
        <div id="box7">7</div>
        <div id="box8">8</div>
        <div id="box9">9</div>



    </div>
</body>
</html>
