<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Grid Layout</title>
  </head>
  <style>
    .container {
      display: grid;
      gap: 3%;
      grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
      grid-template-areas:
        "box1 box1 box2"
        "box1 box1 box3"
        "box4 box4 box5"

        
      
    }
    div {
      background-color: #5d853c;
      height: 100px;
    }
    
    .box1 {
      background-color: #5d853c !important;
    }
    
    .box2 {
      background-color: #ff6b6b !important;
    }
    
    .box3 {
      background-color: #4ecdc4 !important;
    }
    
    .box4 {
      background-color: #ffd93d !important;
    }
    
    .box5 {
      background-color: #a8e6cf !important;
    }
  </style>
  <body>
    <div class="container" style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 3%; padding: 20px;">
        <div class="box1" style="grid-area: box1;"></div>
        <div class="box2" style="grid-area: box2;"></div>
        <div class="box3" style="grid-area: box3;"></div>
        <div class="box4" style="grid-area: box4;"></div>
        <div class="box5" style="grid-area: box5;"></div>
        
        </div>
    </div>
  </body>
