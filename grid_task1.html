<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container{
        display:grid;
        height: 90vh;
        grid-template-columns: repeat(4,1fr); 
      grid-template-areas:
        "box1 box2 box3 box4"
        "box5 box6 box7 box8"
        "box9 box10 box11 box12"
        ;


            gap: 15px; 
        }
        .container>div{
            outline: 3px solid black;
            background-color: blanchedalmond;
        }
    </style>
</head>
<body>
    <div class="container">
         <div id="box1">1</div>
        <div id="box2">2</div>
        <div id="box3">3</div>
        <div id="box4">4</div>
        <div id="box5">5</div>
        <div id="box6">6</div>
        <div id="box7">7</div>
        <div id="box8">8</div>
        <div id="box9">9</div>
        <div id="box10">10</div>
        <div id="box11">11</div>
        <div id="box12">12</div>

    </div>
    
</body>
</html>
