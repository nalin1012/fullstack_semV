    .box {
        width: 100%;
        height: 990px;
        font-weight: 900;
        text-align: center;
        text-transform: uppercase;
        font-size: 200px;
        color: white;
        font-weight: bold;
        position: sticky;
        top: 1px;
    }

    .box img {
        background:
            linear-gradient(to bottom, rgba(0, 0, 0, 0) 0%, rgba(95, 38, 164, 0.65) 100%),
            url('your-image.jpg');

        /* Ensure the image covers the container */
        background-size: cover;
        background-position: center;
        height: auto;
        /* Set desired height */
        width: 95%;
    }

    .text {
        background: linear-gradient(to right, #9d1db1, #402c45);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
    }
</style>
